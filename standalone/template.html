<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python — Every Language</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid #dedee2;background:#fff}h1{font-size:17px;margin:0;letter-spacing:-.03em}header span{color:#86868b;font-size:12px}button{border:0;border-radius:10px;background:#eeeef1;padding:10px 15px;color:#202024;font-weight:600;cursor:pointer}button:hover{filter:brightness(.95)}.run{background:#0071e3;color:white}.shell{max-width:1200px;margin:36px auto;padding:0 24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.top h2{font-size:28px;letter-spacing:-.05em;margin:0}.actions{display:flex;gap:8px}.editor{background:white;border:1px solid #e0e0e5;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px #2020300a}.file{padding:15px 22px;border-bottom:1px solid #eeeef1;font-size:12px;font-weight:600;color:#62626a}.file b{color:#0071e3;margin-right:9px}textarea{display:block;width:100%;height:45vh;min-height:280px;border:0;resize:vertical;padding:24px;outline:0;background:#fff;color:#24242b;font:14px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4}.out-head{padding:13px 22px;background:#f8f8fa;border-top:1px solid #eeeef1;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}.out-head button{padding:5px 9px;font-size:11px}pre{margin:0;padding:20px 22px;min-height:130px;max-height:250px;overflow:auto;white-space:pre-wrap;font:13px/1.7 ui-monospace,monospace;color:#41414c}.foot{color:#86868b;font-size:12px;margin:18px 4px;line-height:1.5}@media(max-width:600px){header{padding:17px}.shell{margin:25px auto;padding:0 14px}.top{align-items:flex-start;gap:15px;flex-direction:column}.actions{flex-wrap:wrap}textarea{height:40vh}}
</style></head><body><header><h1>◈ &nbsp; Every Language <span>/ Python</span></h1><span>OFFLINE EDITION</span></header><main class="shell"><div class="top"><h2>Your Python workspace.</h2><div class="actions"><button id="open">Open file</button><button id="save">Save file</button><button id="run" class="run">▶ &nbsp; Run code</button><input id="input" type="file" accept=".py,text/plain" hidden></div></div><div class="editor"><div class="file"><b>Py</b><span id="filename">hello_world.py</span></div><textarea id="code" spellcheck="false" aria-label="Python code"># Your first Python program

for number in range(3):
    print("Let's build something.")</textarea><div class="out-head"><span>Output</span><button id="clear">Clear</button></div><pre id="output">Run your code to see the output here.</pre></div><p class="foot" id="status">Python is bundled inside this file. No internet connection needed.</p></main>
<script>/*__RUNTIME_ASSETS__*/</script>
<script>/*__ASM__*/</script>

<script>
const code=document.getElementById('code'),output=document.getElementById('output'),status=document.getElementById('status'),run=document.getElementById('run');let runtime,filename='hello_world.py';
run.onclick=async()=>{run.disabled=true;output.textContent='';try{if(!runtime){status.textContent='Starting Python for the first time…';runtime=loadPyodide({indexURL:'https://offline.invalid/'}).catch(error=>{runtime=null;throw error});}const py=await runtime;status.textContent='Running…';let text='';py.setStdout({batched:line=>{text+=line+'\n';output.textContent=text}});py.setStderr({batched:line=>{text+=line+'\n';output.textContent=text}});await py.runPythonAsync(code.value);if(!text)output.textContent='Program finished with no output.';status.textContent='Finished. Python is running locally in your browser.'}catch(e){output.textContent+=String(e);status.textContent='Something went wrong. Check the output for details.'}finally{run.disabled=false}};
document.getElementById('clear').onclick=()=>output.textContent='';document.getElementById('open').onclick=()=>document.getElementById('input').click();document.getElementById('input').onchange=async e=>{const f=e.target.files[0];if(!f)return;code.value=await f.text();filename=f.name;document.getElementById('filename').textContent=filename;e.target.value=''};document.getElementById('save').onclick=()=>{const url=URL.createObjectURL(new Blob([code.value],{type:'text/x-python'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};code.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();code.setRangeText('    ',code.selectionStart,code.selectionEnd,'end')}};
</script></body></html>
